name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        env:
          # Valores fake apenas para a suíte de testes rodar sem credenciais reais.
          GROQ_API_KEY: chave-de-teste-fake
          SUPABASE_JWT_SECRET: segredo-de-teste-fake
        run: pytest --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t redacao-ai:ci .
