services:
  redacao-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: redacao-ai:latest
    container_name: redacao-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persiste o banco vetorial do ChromaDB entre restarts do container.
      # Sem isso, cada `docker compose up` recriaria a base do zero.
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  chroma_data:
